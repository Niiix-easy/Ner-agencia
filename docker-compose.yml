version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ner_postgres
    environment:
      POSTGRES_USER: ner_admin
      POSTGRES_PASSWORD: ner_secure_password
      POSTGRES_DB: ner_agency_os
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ner_network

  redis:
    image: redis:7-alpine
    container_name: ner_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ner_network

  minio:
    image: minio/minio:latest
    container_name: ner_minio
    environment:
      MINIO_ROOT_USER: ner_minio_admin
      MINIO_ROOT_PASSWORD: ner_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - ner_network

  n8n:
    image: n8nio/n8n:latest
    container_name: ner_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - ner_network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  n8n_data:

networks:
  ner_network:
    driver: bridge
